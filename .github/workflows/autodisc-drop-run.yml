name: One-shot AutoDisc Drop
on:
  push:
    branches: [main]
    paths: [.github/workflows/autodisc-drop-run.yml]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ZIP via AutoDisc and publish result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/drop && mkdir -p /tmp/drop
          cat > /tmp/drop/package.json <<'JSON'
          {"name":"autodisc-hello-world","version":"1.0.0","private":true,"scripts":{"start":"node server.js"}}
          JSON
          cat > /tmp/drop/server.js <<'JS'
          const http=require('http');const port=process.env.PORT||3000;const html='<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hello, world!</title></head><body style="margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui"><h1 style="font-size:clamp(3rem,12vw,8rem);letter-spacing:-.06em">Hello, world!</h1></body></html>';http.createServer((req,res)=>{res.writeHead(200,{'Content-Type':'text/html; charset=utf-8'});res.end(html)}).listen(port,'0.0.0.0');
          JS
          (cd /tmp/drop && zip -q -r /tmp/drop.zip .)
          RESPONSE=$(curl -fsS -X POST https://api.autodisc.xyz/api/v1/drops/upload \
            -F 'source=@/tmp/drop.zip;type=application/zip' \
            -F 'request={"lifetime_hours":24,"requested_mode":"auto"}')
          STATUS_URL=$(printf '%s' "$RESPONSE" | jq -r '.status_url')
          CONTROL_TOKEN=$(printf '%s' "$RESPONSE" | jq -r '.control_token')
          CLAIM_URL=$(printf '%s' "$RESPONSE" | jq -r '.claim_url')
          EXPIRES_AT=$(printf '%s' "$RESPONSE" | jq -r '.expires_at')
          echo "::add-mask::$CONTROL_TOKEN"
          RESULT=''
          EXIT_CODE=1
          for i in $(seq 1 60); do
            STATUS=$(curl -fsS "$STATUS_URL" -H "Authorization: Bearer $CONTROL_TOKEN")
            STATE=$(printf '%s' "$STATUS" | jq -r '.status')
            if [ "$STATE" = "ready" ]; then
              PUBLIC_URL=$(printf '%s' "$STATUS" | jq -r '.public_url')
              RESULT=$(jq -n --arg status ready --arg public_url "$PUBLIC_URL" --arg claim_url "$CLAIM_URL" --arg expires_at "$EXPIRES_AT" '{status:$status,public_url:$public_url,claim_url:$claim_url,expires_at:$expires_at}')
              EXIT_CODE=0
              break
            fi
            if [ "$STATE" = "failed" ]; then
              ERROR=$(printf '%s' "$STATUS" | jq -c 'del(.control_token)')
              RESULT=$(jq -n --arg status failed --arg error "$ERROR" '{status:$status,error:$error}')
              break
            fi
            sleep 5
          done
          [ -n "$RESULT" ] || RESULT='{"status":"timed_out"}'
          CONTENT=$(printf '%s\n' "$RESULT" | base64 -w0)
          EXISTING_SHA=$(curl -fsS https://api.github.com/repos/yoits9090/test/contents/autodisc-drop-result.json -H "Authorization: Bearer $GH_TOKEN" | jq -r '.sha // empty')
          if [ -n "$EXISTING_SHA" ]; then
            PAYLOAD=$(jq -n --arg message 'Record AutoDisc Drop result' --arg content "$CONTENT" --arg sha "$EXISTING_SHA" '{message:$message,content:$content,sha:$sha,branch:"main"}')
          else
            PAYLOAD=$(jq -n --arg message 'Record AutoDisc Drop result' --arg content "$CONTENT" '{message:$message,content:$content,branch:"main"}')
          fi
          curl -fsS -X PUT https://api.github.com/repos/yoits9090/test/contents/autodisc-drop-result.json \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -d "$PAYLOAD" >/dev/null
          exit "$EXIT_CODE"
