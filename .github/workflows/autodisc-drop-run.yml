name: One-shot AutoDisc Drop
on:
  push:
    branches: [main]
    paths: [.github/workflows/autodisc-drop-run.yml]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via AutoDisc and publish result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS -X POST https://api.autodisc.xyz/api/v1/drops \
            -H 'Content-Type: application/json' \
            -d '{"source":{"kind":"github","url":"https://github.com/yoits9090/test","ref":"autodisc-hello-20260817"},"lifetime_hours":24,"requested_mode":"auto"}')
          STATUS_URL=$(printf '%s' "$RESPONSE" | jq -r '.status_url')
          CONTROL_TOKEN=$(printf '%s' "$RESPONSE" | jq -r '.control_token')
          CLAIM_URL=$(printf '%s' "$RESPONSE" | jq -r '.claim_url')
          EXPIRES_AT=$(printf '%s' "$RESPONSE" | jq -r '.expires_at')
          echo "::add-mask::$CONTROL_TOKEN"
          for i in $(seq 1 60); do
            STATUS=$(curl -fsS "$STATUS_URL" -H "Authorization: Bearer $CONTROL_TOKEN")
            STATE=$(printf '%s' "$STATUS" | jq -r '.status')
            if [ "$STATE" = "ready" ]; then
              PUBLIC_URL=$(printf '%s' "$STATUS" | jq -r '.public_url')
              jq -n --arg status ready --arg public_url "$PUBLIC_URL" --arg claim_url "$CLAIM_URL" --arg expires_at "$EXPIRES_AT" '{status:$status,public_url:$public_url,claim_url:$claim_url,expires_at:$expires_at}' > result.json
              CONTENT=$(base64 -w0 result.json)
              curl -fsS -X PUT https://api.github.com/repos/yoits9090/test/contents/autodisc-drop-result.json \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                -d "$(jq -n --arg message 'Record AutoDisc Drop result' --arg content "$CONTENT" '{message:$message,content:$content,branch:"main"}')" >/dev/null
              exit 0
            fi
            if [ "$STATE" = "failed" ]; then
              ERROR=$(printf '%s' "$STATUS" | jq -c 'del(.control_token)')
              jq -n --arg status failed --arg error "$ERROR" '{status:$status,error:$error}' > result.json
              CONTENT=$(base64 -w0 result.json)
              curl -fsS -X PUT https://api.github.com/repos/yoits9090/test/contents/autodisc-drop-result.json \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                -d "$(jq -n --arg message 'Record failed AutoDisc Drop result' --arg content "$CONTENT" '{message:$message,content:$content,branch:"main"}')" >/dev/null
              exit 1
            fi
            sleep 5
          done
          exit 1
