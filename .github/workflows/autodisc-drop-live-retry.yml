name: AutoDisc Hello Live Retry
on:
  push:
    branches: [main]
    paths: [.github/workflows/autodisc-drop-live-retry.yml]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Create and monitor AutoDisc Drop
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RESULT_PATH=autodisc-drop-live-result.json

          write_result() {
            local body="$1"
            printf '%s\n' "$body" > result.json
            local encoded sha payload
            encoded=$(base64 -w0 result.json)
            sha=$(curl -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/yoits9090/test/contents/$RESULT_PATH?ref=main" \
              | jq -r '.sha // empty')
            if [ -n "$sha" ]; then
              payload=$(jq -n --arg message 'Update AutoDisc live result' --arg content "$encoded" --arg sha "$sha" '{message:$message,content:$content,sha:$sha,branch:"main"}')
            else
              payload=$(jq -n --arg message 'Record AutoDisc live result' --arg content "$encoded" '{message:$message,content:$content,branch:"main"}')
            fi
            curl -fsS -X PUT \
              "https://api.github.com/repos/yoits9090/test/contents/$RESULT_PATH" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -d "$payload" >/dev/null
          }

          ATTEMPTS='[]'
          for attempt in 1 2 3; do
            RESPONSE=$(curl -fsS -X POST https://api.autodisc.xyz/api/v1/drops \
              -H 'Content-Type: application/json' \
              -d '{"source":{"kind":"github","url":"https://github.com/yoits9090/test","ref":"autodisc-hello-20260817"},"lifetime_hours":24,"requested_mode":"auto"}')

            DROP_ID=$(printf '%s' "$RESPONSE" | jq -r '.drop_id')
            STATUS_URL=$(printf '%s' "$RESPONSE" | jq -r '.status_url')
            CONTROL_TOKEN=$(printf '%s' "$RESPONSE" | jq -r '.control_token')
            CLAIM_URL=$(printf '%s' "$RESPONSE" | jq -r '.claim_url')
            EXPIRES_AT=$(printf '%s' "$RESPONSE" | jq -r '.expires_at')
            INITIAL_PUBLIC_URL=$(printf '%s' "$RESPONSE" | jq -r '.public_url // empty')
            echo "::add-mask::$CONTROL_TOKEN"

            START=$(jq -n \
              --arg status deploying \
              --argjson attempt "$attempt" \
              --arg drop_id "$DROP_ID" \
              --arg public_url "$INITIAL_PUBLIC_URL" \
              --arg claim_url "$CLAIM_URL" \
              --arg expires_at "$EXPIRES_AT" \
              --argjson attempts "$ATTEMPTS" \
              '{status:$status,attempt:$attempt,drop_id:$drop_id,public_url:$public_url,claim_url:$claim_url,expires_at:$expires_at,previous_attempts:$attempts}')
            write_result "$START"

            FINAL=''
            for poll in $(seq 1 36); do
              STATUS=$(curl -fsS "$STATUS_URL" -H "Authorization: Bearer $CONTROL_TOKEN")
              STATE=$(printf '%s' "$STATUS" | jq -r '.status')
              if [ "$STATE" = "ready" ] || [ "$STATE" = "failed" ]; then
                FINAL="$STATUS"
                break
              fi
              sleep 5
            done

            if [ -z "$FINAL" ]; then
              ATTEMPTS=$(printf '%s' "$ATTEMPTS" | jq --arg drop_id "$DROP_ID" '. + [{drop_id:$drop_id,status:"timeout"}]')
              continue
            fi

            STATE=$(printf '%s' "$FINAL" | jq -r '.status')
            PUBLIC_URL=$(printf '%s' "$FINAL" | jq -r '.public_url // empty')
            FAILURE=$(printf '%s' "$FINAL" | jq -r '.failure_message // empty')

            if [ "$STATE" = "ready" ]; then
              DONE=$(jq -n \
                --arg status ready \
                --argjson attempt "$attempt" \
                --arg drop_id "$DROP_ID" \
                --arg public_url "$PUBLIC_URL" \
                --arg claim_url "$CLAIM_URL" \
                --arg expires_at "$EXPIRES_AT" \
                --argjson previous_attempts "$ATTEMPTS" \
                '{status:$status,attempt:$attempt,drop_id:$drop_id,public_url:$public_url,claim_url:$claim_url,expires_at:$expires_at,previous_attempts:$previous_attempts}')
              write_result "$DONE"
              exit 0
            fi

            ATTEMPTS=$(printf '%s' "$ATTEMPTS" | jq --arg drop_id "$DROP_ID" --arg failure "$FAILURE" '. + [{drop_id:$drop_id,status:"failed",failure_message:$failure}]')
            FAILED=$(jq -n --arg status retrying --argjson attempt "$attempt" --arg failure "$FAILURE" --argjson attempts "$ATTEMPTS" '{status:$status,attempt:$attempt,failure_message:$failure,attempts:$attempts}')
            write_result "$FAILED"

            if [ "$FAILURE" != "runtime_binding_missing" ]; then
              exit 1
            fi
            sleep 8
          done

          OUT=$(jq -n --arg status failed --argjson attempts "$ATTEMPTS" '{status:$status,attempts:$attempts}')
          write_result "$OUT"
          exit 1
