name: Retry AutoDisc Hello Drop
on:
  push:
    branches: [main]
    paths: [.github/workflows/autodisc-drop-retry.yml]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Retry AutoDisc Drop
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RESULT_FILE=autodisc-drop-retry-result.json
          ATTEMPTS='[]'

          write_result() {
            local json="$1"
            printf '%s\n' "$json" > result.json
            local content sha payload
            content=$(base64 -w0 result.json)
            sha=$(curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/yoits9090/test/contents/$RESULT_FILE?ref=main" \
              | jq -r '.sha // empty' 2>/dev/null || true)
            if [ -n "$sha" ]; then
              payload=$(jq -n --arg message 'Update AutoDisc retry result' --arg content "$content" --arg sha "$sha" '{message:$message,content:$content,sha:$sha,branch:"main"}')
            else
              payload=$(jq -n --arg message 'Record AutoDisc retry result' --arg content "$content" '{message:$message,content:$content,branch:"main"}')
            fi
            curl -fsS -X PUT "https://api.github.com/repos/yoits9090/test/contents/$RESULT_FILE" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -d "$payload" >/dev/null
          }

          for attempt in 1 2 3; do
            RESPONSE=$(curl -fsS -X POST https://api.autodisc.xyz/api/v1/drops \
              -H 'Content-Type: application/json' \
              -d '{"source":{"kind":"github","url":"https://github.com/yoits9090/test","ref":"autodisc-hello-20260817"},"lifetime_hours":24,"requested_mode":"auto"}')

            DROP_ID=$(printf '%s' "$RESPONSE" | jq -r '.drop_id')
            STATUS_URL=$(printf '%s' "$RESPONSE" | jq -r '.status_url')
            CONTROL_TOKEN=$(printf '%s' "$RESPONSE" | jq -r '.control_token')
            CLAIM_URL=$(printf '%s' "$RESPONSE" | jq -r '.claim_url')
            EXPIRES_AT=$(printf '%s' "$RESPONSE" | jq -r '.expires_at')
            echo "::add-mask::$CONTROL_TOKEN"

            FINAL=''
            for i in $(seq 1 48); do
              STATUS=$(curl -fsS "$STATUS_URL" -H "Authorization: Bearer $CONTROL_TOKEN")
              STATE=$(printf '%s' "$STATUS" | jq -r '.status')
              if [ "$STATE" = "ready" ] || [ "$STATE" = "failed" ]; then
                FINAL="$STATUS"
                break
              fi
              sleep 5
            done

            if [ -z "$FINAL" ]; then
              ATTEMPTS=$(printf '%s' "$ATTEMPTS" | jq --arg drop_id "$DROP_ID" --arg status timeout '. + [{drop_id:$drop_id,status:$status}]')
              continue
            fi

            STATE=$(printf '%s' "$FINAL" | jq -r '.status')
            PUBLIC_URL=$(printf '%s' "$FINAL" | jq -r '.public_url // empty')
            FAILURE=$(printf '%s' "$FINAL" | jq -r '.failure_message // empty')
            ATTEMPTS=$(printf '%s' "$ATTEMPTS" | jq --arg drop_id "$DROP_ID" --arg status "$STATE" --arg failure "$FAILURE" '. + [{drop_id:$drop_id,status:$status,failure_message:($failure | select(length>0))}]')

            if [ "$STATE" = "ready" ]; then
              OUT=$(jq -n \
                --arg status ready \
                --arg drop_id "$DROP_ID" \
                --arg public_url "$PUBLIC_URL" \
                --arg claim_url "$CLAIM_URL" \
                --arg expires_at "$EXPIRES_AT" \
                --argjson attempts "$ATTEMPTS" \
                '{status:$status,drop_id:$drop_id,public_url:$public_url,claim_url:$claim_url,expires_at:$expires_at,attempts:$attempts}')
              write_result "$OUT"
              exit 0
            fi

            if [ "$FAILURE" != "runtime_binding_missing" ]; then
              OUT=$(jq -n --arg status failed --argjson attempts "$ATTEMPTS" '{status:$status,attempts:$attempts}')
              write_result "$OUT"
              exit 1
            fi

            sleep 10
          done

          OUT=$(jq -n --arg status failed --argjson attempts "$ATTEMPTS" '{status:$status,attempts:$attempts}')
          write_result "$OUT"
          exit 1
